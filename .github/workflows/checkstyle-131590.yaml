#131590 Catarina Barata
name: Checkstyle Quality Gate 131590

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Checkstyle
        uses: checkstyle/action-checkstyle@master
        with:
          level: 'error'
          config_path: 'Checkstyle/checkstyle-131590.xml'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
