# Executa a bateria de testes unitários (JUnit) com Maven
# sempre que é feito push para qualquer ramo ou aberto um PR para o main.

name: Testes unitários (Maven)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Compilar e executar os testes unitários
      run: mvn -B test --file pom.xml
