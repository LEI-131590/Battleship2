# 131590 - Catarina Barata
name: Qodana smell gate 131590
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-131590.yaml
          use-annotations: true
          post-pr-comment: true
